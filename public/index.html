<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Server Room</title>
  <style>
    :root { --bg: #0b0f0c; --fg: #9fe8a8; --dim: #5d8a63; --you: #e8e29f; --win: #7ff0ff; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      display: flex; justify-content: center;
    }
    main { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; padding: 16px; }
    #log { flex: 1; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; padding-bottom: 8px; }
    #log::-webkit-scrollbar { width: 6px; } #log::-webkit-scrollbar-thumb { background: #1d2a20; }
    .you { color: var(--you); margin-top: 1em; }
    .room { margin-top: .25em; }
    .win { color: var(--win); }
    .dim { color: var(--dim); }
    form { display: flex; gap: .5em; border-top: 1px solid #1d2a20; padding-top: 10px; }
    form span { color: var(--you); }
    input {
      flex: 1; background: transparent; border: 0; outline: 0;
      color: var(--you); font: inherit; caret-color: var(--fg);
    }
    body::after { /* faint scanlines */
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.18) 2px 3px);
    }
  </style>
</head>
<body>
  <main>
    <div id="log" aria-live="polite"></div>
    <form id="f" autocomplete="off">
      <span>&gt;</span>
      <input id="cmd" aria-label="What do you do?" placeholder="what do you do?" autofocus />
    </form>
  </main>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("f");
    const cmd = document.getElementById("cmd");
    // The whole game lives here: the actions taken so far (the server replays
    // them to rebuild the room) plus the visible transcript, saved to
    // localStorage so a refresh or a server restart doesn't lose progress.
    const SAVE_KEY = "serverRoom.save";
    const IDLE_TIMEOUT_MS = 30 * 60 * 1000;
    const MAX_TRANSCRIPT = 300;
    const RESTART = /^(restart|new game|start over)$/i;
    let game = blankGame();

    function blankGame() {
      return { actions: [], transcript: [], escaped: false, lastActive: Date.now() };
    }

    // Storage can be blocked (private mode, disabled site data): the game still
    // works, it just won't survive a refresh.
    function loadSave() {
      try {
        const s = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (s && Array.isArray(s.actions) && Array.isArray(s.transcript) && typeof s.lastActive === "number") return s;
      } catch {}
      return null;
    }
    function persist() {
      game.lastActive = Date.now();
      game.transcript = game.transcript.slice(-MAX_TRANSCRIPT);
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); } catch {}
    }
    const isIdle = (g) => Date.now() - g.lastActive > IDLE_TIMEOUT_MS;

    function print(text, cls, { animate = true, record = true } = {}) {
      if (record) game.transcript.push({ text, cls });
      const div = document.createElement("div");
      div.className = cls;
      log.appendChild(div);
      // Type the room's reply out like an old terminal.
      if (animate && cls.includes("room") && text) {
        let i = 0;
        const tick = () => {
          div.textContent = text.slice(0, (i += 3));
          log.scrollTop = log.scrollHeight;
          if (i < text.length) setTimeout(tick, 8);
        };
        tick();
      } else {
        div.textContent = text;
        log.scrollTop = log.scrollHeight;
      }
    }

    async function send(payload) {
      cmd.disabled = true;
      try {
        const res = await fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...payload, actions: game.actions }),
        });
        const data = await res.json();
        if (res.ok) {
          game.actions = data.actions;
          game.escaped = Boolean(data.escaped);
        }
        print(data.text, data.escaped ? "room win" : "room");
        persist();
        if (data.escaped) { cmd.placeholder = "refresh to play again"; return; }
      } catch {
        print("[connection lost. the hum gets louder.]", "room dim", { record: false });
      }
      cmd.disabled = false;
      cmd.focus();
    }

    // expired: the player went idle, so the room says so before the intro.
    function startNewGame(expired = false) {
      game = blankGame();
      send(expired ? { expired: true } : { input: "" });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const input = cmd.value.trim();
      if (!input) return;
      cmd.value = "";
      print("> " + input, "you");
      if (RESTART.test(input)) return startNewGame();
      if (isIdle(game)) return startNewGame(true); // left the tab open past the timeout
      send({ input });
    });

    // Resume a saved game, unless it's finished or has gone idle.
    const saved = loadSave();
    if (saved && !saved.escaped && !isIdle(saved)) {
      game = saved;
      for (const { text, cls } of game.transcript) print(text, cls, { animate: false, record: false });
      cmd.focus();
    } else {
      try { localStorage.removeItem(SAVE_KEY); } catch {}
      startNewGame(Boolean(saved && !saved.escaped));
    }
  </script>
</body>
</html>
